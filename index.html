<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiFi Playbook — دليل توقيع وإغلاق العملاء وإدارة الحسابات</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI1MCIgZmlsbD0iIzc2RTg3NiIvPgogIDxyZWN0IHg9IjIyIiB5PSIzMCIgd2lkdGg9IjU1IiBoZWlnaHQ9IjE4IiByeD0iOSIgZmlsbD0iIzI1MzkzMiIgdHJhbnNmb3JtPSJyb3RhdGUoLTIwIDQ5LjUgMzkpIi8+CiAgPHJlY3QgeD0iMjIiIHk9IjU5IiB3aWR0aD0iNTUiIGhlaWdodD0iMTgiIHJ4PSI5IiBmaWxsPSIjMjUzOTMyIiB0cmFuc2Zvcm09InJvdGF0ZSgtMjAgNDkuNSA2OCkiLz4KPC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#76E876;
    --primary-dark:#57D657;
    --primary-contrast:#253932;
    --primary-light:#C7FAC0;
    --primary-lightest:#A3F098;
    --primary-deepest:#121715;
    --neutral-0:#FFFFFF;
    --neutral-50:#F6F6EE;
    --neutral-100:#E1E1D1;
    --neutral-400:#C7C7C7;
    --neutral-500:#8A8A8A;
    --neutral-600:#474747;
    --neutral-1000:#000000;
    --danger:#FF3B30;
    --danger-light:#FFE6E4;
    --warning:#D48E00;
    --warning-light:#FFF3E0;
    --success:#158900;
    --success-light:#D6FFD8;
    --radius-sm:4px;
    --radius-md:12px;
    --radius-lg:22px;
    --radius-full:100px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--neutral-50);
    color:var(--neutral-1000);
    position:relative;
  }
  /* Global ambient backdrop — fixed, sits behind every glass surface on the site */
  .ambient-bg{
    position:fixed;
    top:0; right:0; bottom:0; left:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .ambient-bg .blob{
    position:absolute;
    border-radius:50%;
  }
  .ambient-bg .blob-a{ width:520px; height:520px; background:var(--primary); opacity:.5; filter:blur(140px); top:-160px; right:-140px; }
  .ambient-bg .blob-b{ width:480px; height:480px; background:var(--primary-contrast); opacity:.4; filter:blur(150px); bottom:-180px; left:-140px; }
  .ambient-bg .blob-c{ width:360px; height:360px; background:var(--primary-lightest); opacity:.35; filter:blur(130px); top:35%; left:38%; }
  .ambient-bg .blob-d{ width:300px; height:300px; background:var(--primary); opacity:.3; filter:blur(120px); bottom:10%; right:12%; }
  .shell{
    position:relative;
    z-index:1;
    display:flex;
    min-height:100vh;
  }
  /* Sidebar sits on the right in RTL */
  .sidebar{
    width:320px;
    flex-shrink:0;
    background:rgba(255,255,255,0.42);
    backdrop-filter:blur(26px) saturate(200%);
    -webkit-backdrop-filter:blur(26px) saturate(200%);
    border-left:1px solid rgba(255,255,255,0.5);
    box-shadow:inset -1px 0 0 rgba(255,255,255,0.4), 10px 0 40px -28px rgba(37,57,50,0.35);
    display:flex;
    flex-direction:column;
    padding:28px 18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 8px 22px 8px;
    margin-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,0.5);
  }
  .brand-badge{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .brand-badge svg{width:100%;height:100%;display:block;}
  .brand-text .name{font-weight:700;font-size:21px;line-height:1.25;letter-spacing:-0.01em;}
  .brand-text .sub{font-size:13px;color:var(--neutral-600);font-weight:500;margin-top:2px;}
  .nav-label{
    font-size:12px;
    color:var(--neutral-500);
    text-transform:uppercase;
    font-weight:600;
    letter-spacing:.02em;
    padding:18px 14px 12px 14px;
  }
  nav{display:flex;flex-direction:column;gap:8px;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border-radius:var(--radius-lg);
    font-size:15.5px;
    font-weight:500;
    color:var(--neutral-1000);
    cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.45);
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    text-align:right;
    width:100%;
    font-family:inherit;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
    transition:background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .nav-item::before{
    content:"";
    position:absolute;
    top:-60%; right:-20%;
    width:70%; height:140%;
    background:rgba(255,255,255,0.35);
    border-radius:50%;
    filter:blur(16px);
    opacity:.6;
    pointer-events:none;
    z-index:0;
  }
  .nav-item > *{ position:relative; z-index:1; }
  .nav-item:hover{
    background:rgba(255,255,255,0.55);
    border-color:rgba(255,255,255,0.7);
    transform:translateX(-2px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 22px -14px rgba(37,57,50,0.3);
  }
  .nav-item.active{
    background:rgba(37,57,50,0.88);
    backdrop-filter:blur(22px) saturate(220%);
    -webkit-backdrop-filter:blur(22px) saturate(220%);
    color:var(--neutral-0);
    font-weight:600;
    border:1.5px solid rgba(118,232,118,0.55);
    border-left:4px solid var(--primary);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 16px 30px -16px rgba(37,57,50,0.45);
  }
  .nav-item.active::before{
    background:rgba(255,255,255,0.12);
  }
  .nav-item .icon{
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-md);
    background:rgba(199,250,192,0.65);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.5);
    color:var(--primary-contrast);
  }
  .nav-item .icon svg{width:20px;height:20px;stroke:currentColor;}
  .nav-item.active .icon{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.3);
    color:var(--neutral-0);
  }
  .nav-item .label{flex:1;line-height:1.35;}
  .nav-item .count{
    font-size:11px;
    background:rgba(255,243,224,0.8);
    border:1px solid rgba(255,255,255,0.5);
    color:var(--warning);
    padding:3px 10px;
    border-radius:var(--radius-full);
    font-weight:600;
    flex-shrink:0;
  }
  .nav-item.active .count{
    background:rgba(255,255,255,0.2);
    border-color:rgba(255,255,255,0.3);
    color:var(--neutral-0);
  }
  .sidebar-footer{
    margin-top:auto;
    padding:14px 12px;
    font-size:11px;
    color:var(--neutral-600);
    border-top:1px solid rgba(255,255,255,0.5);
  }
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    padding:28px 40px 20px 40px;
    border-bottom:1px solid rgba(255,255,255,0.5);
  }
  .topbar .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:500;
    color:var(--success);
    background:rgba(214,255,216,0.7);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.5);
    padding:4px 12px;
    border-radius:var(--radius-full);
    margin-bottom:12px;
  }
  .section-index{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:600;
    color:var(--primary-contrast);
    background:rgba(199,250,192,0.65);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:var(--radius-full);
    padding:3px 12px;
    margin-inline-start:10px;
  }
  .topbar-title-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
  }
  .topbar h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 6px 0;
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .topbar p{
    font-size:15.5px;
    color:var(--neutral-600);
    margin:0 0 18px 0;
    max-width:660px;
    line-height:1.8;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:420px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:var(--radius-full);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--primary);
    border-radius:var(--radius-full);
    width:0%;
    transition:width .3s ease;
  }
  .progress-text{
    font-size:12px;
    font-weight:500;
    color:var(--neutral-600);
    white-space:nowrap;
  }
  .content{
    padding:32px 40px 60px 40px;
    background:transparent;
    position:relative;
    z-index:1;
  }
  .section{display:none;}
  .section.active{display:block;}
  .section-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:24px;
  }
  .section-header h2{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px 0;
  }
  .section-header p{
    font-size:14px;
    color:var(--neutral-600);
    margin:0;
    max-width:600px;
    line-height:1.6;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:22px;
    position:relative;
    z-index:1;
    perspective:1200px;
    align-items:start; /* كل بطاقة بحجم محتواها — لا تتمدد لمساواة أطول بطاقة في الصف */
  }
  .slot{
    position:relative;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(30px) saturate(240%);
    -webkit-backdrop-filter:blur(30px) saturate(240%);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:var(--radius-lg);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.8),
      inset 0 0 0 1px rgba(255,255,255,0.06),
      0 18px 34px -16px rgba(37,57,50,0.35),
      0 2px 6px rgba(37,57,50,0.1);
    transform-style:preserve-3d;
    transform:perspective(1200px) rotateX(0deg) rotateY(0deg);
    transition:transform .35s ease, box-shadow .35s ease, background .35s ease, border-color .35s ease;
    overflow:hidden;
  }
  .slot::before{
    content:"";
    position:absolute;
    top:-40%; left:-30%;
    width:75%; height:75%;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    filter:blur(18px);
    opacity:.5;
    pointer-events:none;
    z-index:0;
  }
  .slot > *{ position:relative; z-index:1; }
  .slot:hover{
    background:rgba(255,255,255,0.36);
    border-color:rgba(118,232,118,0.8);
    z-index:5;
    transform:perspective(1200px) rotateX(3deg) rotateY(-2deg) translateY(-6px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 0 0 0 1px rgba(255,255,255,0.08),
      0 26px 44px -18px rgba(37,57,50,0.42),
      0 6px 14px rgba(37,57,50,0.14);
  }
  .slot-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .slot-icon{
    width:40px;height:40px;
    border-radius:var(--radius-md);
    background:rgba(199,250,192,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7), 0 6px 14px -6px rgba(37,57,50,0.28);
    color:var(--primary-contrast);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .slot-icon svg{width:20px;height:20px;stroke:currentColor;}
  .status-pill{
    font-size:11px;
    font-weight:500;
    padding:4px 10px;
    border-radius:var(--radius-full);
    background:rgba(255,243,224,0.6);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.4);
    color:var(--warning);
    white-space:nowrap;
  }
  .status-pill.done{
    background:rgba(214,255,216,0.7);
    color:var(--success);
  }
  .slot h4{
    font-size:16px;
    font-weight:700;
    margin:0;
    line-height:1.5;
  }
  .slot .desc{
    font-size:14px;
    color:var(--neutral-600);
    margin:0;
    line-height:1.75;
    flex:1;
  }
  .slot .hint{
    font-size:12px;
    color:var(--neutral-500);
    border-top:1px dashed rgba(89,89,89,0.25);
    padding-top:10px;
    margin-top:2px;
  }
  .slot-files{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:2px;
    border-top:1px solid rgba(255,255,255,0.5);
    padding-top:12px;
  }
  .file-link{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-radius:var(--radius-md);
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.6);
    color:var(--primary-contrast);
    font-size:12.5px;
    font-weight:500;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease;
  }
  .file-link:hover{
    background:rgba(255,255,255,0.72);
    border-color:rgba(118,232,118,0.75);
    transform:translateX(-2px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.8), 0 8px 18px -12px rgba(37,57,50,0.4);
  }
  .file-link svg{ width:16px; height:16px; stroke:currentColor; flex-shrink:0; }
  .file-icon{
    width:30px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);
    background:rgba(199,250,192,0.7);
    border:1px solid rgba(255,255,255,0.6);
    color:var(--primary-contrast);
  }
  .file-meta{
    display:flex;
    flex-direction:column;
    gap:1px;
    flex:1;
    min-width:0;
  }
  .file-label{
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .file-sub{
    font-size:11.5px;
    font-weight:500;
    color:var(--neutral-600);
    letter-spacing:.01em;
  }
  .slot-items{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:2px;
    border-top:1px solid rgba(255,255,255,0.5);
    padding-top:12px;
  }
  .req-scroll{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  /* قائمة طويلة: ارتفاع ثابت مع تمرير داخلي — المؤشر على يمين الخانة */
  .req-scroll.scrollable{
    max-height:238px;
    overflow-y:auto;
    direction:ltr;               /* يضع شريط التمرير على اليمين في صفحة RTL */
    padding-inline-start:10px;
    scrollbar-width:thin;
    scrollbar-color:var(--primary) rgba(255,255,255,0.4);
  }
  .req-scroll.scrollable > .req-item{ direction:rtl; }
  .req-scroll.scrollable::-webkit-scrollbar{ width:6px; }
  .req-scroll.scrollable::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.45);
    border-radius:var(--radius-full);
  }
  .req-scroll.scrollable::-webkit-scrollbar-thumb{
    background:var(--primary);
    border-radius:var(--radius-full);
  }
  .req-scroll.scrollable::-webkit-scrollbar-thumb:hover{
    background:var(--primary-dark);
  }
  .req-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 14px;
    border-radius:var(--radius-md);
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .req-logo{
    width:22px;height:22px;flex-shrink:0;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 2px 6px -2px rgba(37,57,50,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .req-logo svg{ width:100%; height:100%; display:block; }
  .req-label{
    font-size:14px;
    font-weight:600;
    color:var(--primary-deepest);
    line-height:1.7;
  }
  .slot-message{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:2px;
    border-top:1px solid rgba(255,255,255,0.5);
    padding-top:12px;
  }
  .msg-text{
    font-size:13.5px;
    line-height:1.9;
    color:var(--primary-deepest);
    white-space:pre-wrap;
    background:rgba(255,255,255,0.72);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:var(--radius-md);
    padding:12px 14px;
    max-height:180px;
    overflow-y:auto;
  }
  .msg-link{
    color:var(--success);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    word-break:break-all;
  }
  .msg-link:hover{ color:var(--primary-dark); }
  .slot-items .copy-btn{ margin-top:4px; }
  .copy-btn{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 16px;
    border-radius:var(--radius-full);
    background:rgba(37,57,50,0.9);
    color:var(--neutral-0);
    border:1px solid rgba(118,232,118,0.5);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .copy-btn svg{ width:15px; height:15px; stroke:currentColor; flex-shrink:0; }
  .copy-btn:hover{ background:var(--primary-contrast); transform:translateY(-1px); }
  .copy-btn.copied{
    background:var(--primary);
    color:var(--primary-contrast);
    border-color:rgba(87,214,87,0.9);
  }
  .file-row{ display:flex; align-items:stretch; gap:8px; }
  .file-row .file-link{ flex:1; min-width:0; }
  .file-dl-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
    border-radius:var(--radius-md);
    background:rgba(199,250,192,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.6);
    color:var(--primary-contrast);
    font-size:11.5px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .file-dl-btn svg{ width:15px; height:15px; stroke:currentColor; flex-shrink:0; }
  .file-dl-btn:hover{
    background:var(--primary);
    border-color:rgba(87,214,87,0.9);
    transform:translateY(-1px);
  }
  .file-open{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--neutral-500);
    transition:color .15s ease;
  }
  .file-link:hover .file-open{ color:var(--primary-contrast); }
  .file-dl-btn.is-loading{

// ── روابط الملفات ──────────────────────────────────────────────────────
// يمكن تعريف الملف بإحدى ثلاث طرق:
//   {url:"<رابط SharePoint / OneDrive / Google Drive>", label:"...", meta:"..."}
//   {drive:"<رابط درايف أو الـ ID>", label:"...", meta:"..."}
//   {href:"assets/....pdf", name:"...", label:"..."}   ← ملف محلي
// تُولَّد روابط «فتح» و«تحميل» تلقائياً حسب مزوّد التخزين.
function driveId(v){
  if(!v) return '';
  const m = String(v).match(/[-\w]{25,}/); // يلتقط الـ ID من أي صيغة رابط درايف
  return m ? m[0] : String(v).trim();
}
function isSharePoint(u){ return /(sharepoint\.com|1drv\.ms|onedrive\.live\.com)/i.test(u || ''); }

function openUrl(f){
  if(f.drive) return `https://drive.google.com/file/d/${driveId(f.drive)}/view?usp=sharing`;
  if(f.url)   return f.url;
  return f.href;
}
function downloadUrl(f){
  if(f.drive) return `https://drive.google.com/uc?export=download&id=${driveId(f.drive)}`;
  if(f.url){
    const u = f.url;
    if(/drive\.google\.com/i.test(u)) return `https://drive.google.com/uc?export=download&id=${driveId(u)}`;
    if(isSharePoint(u)){
      // حالة رابط مشغّل الستريم: .../_layouts/15/stream.aspx?id=<المسار>
      // نحوّله إلى download.aspx?SourceUrl=<المسار> ليُنزّل الملف مباشرة.
      if(/\/_layouts\/15\/stream\.aspx/i.test(u)){
        const idMatch = u.match(/[?&]id=([^&]+)/);
        const base = u.substring(0, u.indexOf('/_layouts/'));
        if(idMatch) return `${base}/_layouts/15/download.aspx?SourceUrl=${idMatch[1]}`;
      }
      // روابط المشاركة المختصرة: https://TENANT/:X:/g/personal/USER/<token>?e=...
      // نحوّلها إلى download.aspx?share=<token> — وهو المسار الرسمي للتنزيل المباشر.
      const m = u.match(/^(https?:\/\/[^/]+)\/:[a-z]:\/[a-z]\/(.+?)\/([^/?]+)(?:\?|$)/i);
      if(m){
        return `${m[1]}/${m[2]}/_layouts/15/download.aspx?share=${m[3]}`;
      }
      // احتياط: إضافة download=1 للرابط الأصلي.
      if(/[?&]download=1\b/.test(u)) return u;
      return u + (u.includes('?') ? '&' : '?') + 'download=1';
    }
    return u;
  }
  return f.href;
}
function isExternal(url){ return /^https?:\/\//i.test(url); }

const nav = document.getElementById('nav');
const content = document.getElementById('content');

function isDone(sl){ return !!((sl.files && sl.files.length) || sl.message || (sl.items && sl.items.length)); }

sections.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-item' + (i===0 ? ' active' : '');
  btn.dataset.id = s.id;
  btn.innerHTML = `<span class="icon">${icon(s.icon)}</span><span class="label">${s.title}</span>`;
  btn.addEventListener('click', () => showSection(s.id));
  nav.appendChild(btn);

  const sec = document.createElement('div');
  sec.className = 'section' + (i===0 ? ' active' : '');
  sec.id = 'sec-' + s.id;
  const slotsHtml = s.slots.map(sl => {
    const done = isDone(sl);
    const filesHtml = (sl.files && sl.files.length) ? `
      <div class="slot-files">
        ${sl.files.map(f => `<div class="file-row">
          <a class="file-link" href="${openUrl(f)}" target="_blank" rel="noopener" title="${f.openOnly ? 'فتح الرابط' : 'فتح الملف'}">
            <span class="file-icon">${icon(f.icon || 'file')}</span>
            <span class="file-meta"><span class="file-label">${f.label}</span>${f.meta ? `<span class="file-sub">${f.meta}</span>` : ''}</span>
            <span class="file-open">${icon('external')}</span>
          </a>
          ${f.openOnly ? '' : `<a class="file-dl-btn" href="${downloadUrl(f)}" download="${f.name||''}" target="_blank" rel="noopener" title="تحميل الملف" aria-label="تحميل ${f.label}">
            ${icon('download')}<span>تحميل</span>
          </a>`}
        </div>`).join('')}
      </div>` : '';
    const itemsCopyText = (sl.items && sl.items.length)
      ? sl.title + ':\n' + sl.items.map(it => '- ' + it).join('\n')
      : '';
    const itemsHtml = (sl.items && sl.items.length) ? `
      <div class="slot-items">
        <div class="req-scroll${sl.items.length > 3 ? ' scrollable' : ''}">
          ${sl.items.map(it => `<div class="req-item">
            <span class="req-logo">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="#76E876"/>
                <rect x="22" y="30" width="55" height="18" rx="9" fill="#253932" transform="rotate(-20 49.5 39)"/>
                <rect x="22" y="59" width="55" height="18" rx="9" fill="#253932" transform="rotate(-20 49.5 68)"/>
              </svg>
            </span>
            <span class="req-label">${escapeHtml(it)}</span>
          </div>`).join('')}
        </div>
        <button class="copy-btn" type="button" data-copy="${encodeURIComponent(itemsCopyText)}">
          ${icon('copy')}<span class="copy-label">نسخ المتطلبات</span>
        </button>
      </div>` : '';
    const messageHtml = sl.message ? `
      <div class="slot-message">
        <div class="msg-text">${linkifyHtml(sl.message)}</div>
        <button class="copy-btn" type="button" data-copy="${encodeURIComponent(sl.message)}">
          ${icon('copy')}<span class="copy-label">نسخ الرسالة</span>
        </button>
      </div>` : '';
    const hintHtml = done ? '' : `<div class="hint">قيد الإعداد — تُفعَّل هذه الخانة فور اعتماد محتواها</div>`;
    return `
    <div class="slot">
      <div class="slot-top">
        <div class="slot-icon">${icon(sl.icon)}</div>
        ${done ? '' : `<span class="status-pill">بانتظار الإضافة</span>`}
      </div>
      <h4>${sl.title}</h4>
      <p class="desc">${sl.desc}</p>
      ${itemsHtml}
      ${messageHtml}
      ${filesHtml}
      ${hintHtml}
    </div>
  `;
  }).join('');
  sec.innerHTML = `
    <div class="grid">${slotsHtml}</div>
    <div class="footer-note">هذا الدليل مرجع حي يتطور باستمرار — تُضاف المواد تباعاً وتُعتمد كل خانة فور اكتمال محتواها. لأي ملاحظة أو مادة مقترحة، تواصل مع إدارة المبيعات.</div>
  `;
  content.appendChild(sec);
});

// Copy-to-clipboard for message slots.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const text = decodeURIComponent(btn.getAttribute('data-copy') || '');
  const label = btn.querySelector('.copy-label');
  const original = label ? label.textContent : '';
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    btn.classList.add('copied');
    btn.querySelector('svg').outerHTML = icon('check');
    if(label) label.textContent = 'تم النسخ';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.querySelector('svg').outerHTML = icon('copy');
      if(label) label.textContent = original;
    }, 1800);
  }catch(err){ /* ignore */ }
});

// Some browsers ignore the `download` attribute for media types they can play
// inline (mp4 especially). Fetch the file as a blob and save it explicitly so
// "تحميل" always downloads instead of opening a player.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.file-dl-btn');
  if(!btn) return;
  const href = btn.getAttribute('href');
  // روابط درايف تُحمَّل من سيرفر جوجل مباشرة — لا يمكن جلبها كـ blob (CORS)
  if(isExternal(href)) return;
  if(location.protocol === 'file:') return; // blob fetch is blocked on file:// — let the browser handle it
  e.preventDefault();
  const name = btn.getAttribute('download') || href.split('/').pop();
  const original = btn.innerHTML;
  btn.classList.add('is-loading');
  btn.innerHTML = `${icon('download')}<span>جارٍ التحميل…</span>`;
  try{
    const res = await fetch(href);
    if(!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(err){
    window.location.href = href; // fallback to the plain link
  }finally{
    btn.classList.remove('is-loading');
    btn.innerHTML = original;
  }
});

function showSection(id){
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + id));
  const idx = sections.findIndex(x => x.id === id);
  const s = sections[idx];
  document.getElementById('page-title').textContent = s.title;
  document.getElementById('page-desc').textContent = s.desc;
  document.getElementById('section-index').textContent = `القسم ${idx+1} من ${sections.length}`;
}

showSection(sections[0].id);
</script>
